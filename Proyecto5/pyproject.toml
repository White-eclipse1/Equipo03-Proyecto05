[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p5"
version = "0.1.0"
description = "Proyecto 5: deteccion, politica y control virtual sobre imagenes completas."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    # Headless: sin dependencias de GUI. Mismo redimensionado que usa YOLOX.
    "opencv-python-headless==5.0.0.93",
    # El recorrido usa el contrato y la politica de `Proyecto3/src/p3/policy`:
    # mismas versiones que `Proyecto3/pyproject.toml`.
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.hatch.build]
# `pip install -e .` deja importable `p3` sin instalar sus dependencias, que P5 no usa.
dev-mode-dirs = ["src", "../Proyecto3/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/p5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["p5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../Proyecto3/src"]
addopts = "-q"
