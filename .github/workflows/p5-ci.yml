name: P5 CI

on:
  push:
    paths:
      - "Proyecto5/**"
      - "Proyecto3/src/p3/policy/**"
      - "Proyecto3/config/politica.yaml"
      - ".github/workflows/p5-ci.yml"
  pull_request:
    paths:
      - "Proyecto5/**"
      - "Proyecto3/src/p3/policy/**"
      - "Proyecto3/config/politica.yaml"
      - ".github/workflows/p5-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Proyecto5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .

      - name: Download detector weights
        run: python -m p5.detector.weights

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        env:
          P5_DETECTOR_WEIGHTS: models/yolox_tiny.onnx
        run: python -m pytest
