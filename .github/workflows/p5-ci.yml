name: P5 CI

on:
  push:
    paths:
      - "Proyecto5/**"
      - ".github/workflows/p5-ci.yml"
  pull_request:
    paths:
      - "Proyecto5/**"
      - ".github/workflows/p5-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Proyecto5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Download detector weights
        run: |
          mkdir -p models
          curl -fsSL -o models/yolox_tiny.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
          echo "427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7  models/yolox_tiny.onnx" | sha256sum -c -

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        env:
          P5_DETECTOR_WEIGHTS: models/yolox_tiny.onnx
        run: python -m pytest
